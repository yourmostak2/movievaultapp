<style>
/* Layout: a phone-width column (max 480px) like the supplied Movie Vault design. Dark cinema palette with one red accent, bottom tab bar, poster grids, and a detail page with director and cast. */
:root {
  --bg: #09090D;
  --surface: #15151C;
  --surface2: #1F1F29;
  --ink: #F4F4F7;
  --muted: #B0B0C2;
  --line: #2A2A36;
  --accent: #E5253A;
  --accent-ink: #FFFFFF;
  --ok: #38C77B;
  --gold: #F5B82E;
  --font-ui: 'Outfit', 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
  --font-poster: 'Barlow Condensed', 'Hind Siliguri', 'Arial Narrow', Impact, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F3F3F8;
    --surface: #FFFFFF;
    --surface2: #EAEAF1;
    --ink: #14141B;
    --muted: #5D5D70;
    --line: #D8D8E3;
    --accent: #D3182D;
    --ok: #15803D;
    --gold: #B87A00;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F3F3F8;
  --surface: #FFFFFF;
  --surface2: #EAEAF1;
  --ink: #14141B;
  --muted: #5D5D70;
  --line: #D8D8E3;
  --accent: #D3182D;
  --ok: #15803D;
  --gold: #B87A00;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 var(--font-ui);
  padding-inline: 18px;
  padding-block: 14px 104px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app { max-width: 480px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 100%); gap: 22px; }
.app > * { min-width: 0; max-width: 100%; }
html, body { overflow-x: hidden; max-width: 100vw; }
.ic { width: 22px; height: 22px; flex: none; }
h1, h2, h3, p { margin: 0; }

/* top bars */
.bar { display: flex; align-items: center; gap: 12px; }
.bar-t { flex: 1; min-width: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
.hello { flex: 1; min-width: 0; display: grid; line-height: 1.2; }
.hello small { color: var(--muted); font-size: .8rem; }
.hello b { font-size: 1.15rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar-btn { width: 46px; height: 46px; padding: 0; border: 2px solid var(--line); border-radius: 50%; background: var(--surface2); overflow: hidden; display: grid; place-items: center; color: var(--muted); }
.avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
.iconbtn { width: 42px; height: 42px; padding: 0; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); }
.iconbtn.ghost { background: rgba(0, 0, 0, .5); border-color: transparent; color: #fff; backdrop-filter: blur(6px); }
.iconbtn[aria-pressed="true"] { color: var(--accent); }

/* posters (generated artwork, one look per title) */
.poster { --h: 220; --h2: 240; position: relative; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; container-type: inline-size;
  background: linear-gradient(165deg, hsl(var(--h) 65% 34%) 0%, hsl(var(--h2) 55% 14%) 62%, hsl(var(--h2) 50% 6%) 100%); }
.poster::before, .poster::after { content: ""; position: absolute; inset: 0; }
.poster::after { background: linear-gradient(to top, rgba(0, 0, 0, .74), transparent 56%); }
.m-beam::before { background: linear-gradient(112deg, transparent 38%, hsl(var(--h) 95% 70% / .38) 50%, transparent 62%); }
.m-sun::before { background: radial-gradient(circle at 68% 34%, hsl(var(--h) 100% 72%) 0 11%, hsl(var(--h) 100% 60% / .35) 12% 22%, transparent 23%); }
.m-rings::before { background: radial-gradient(circle at 50% 36%, transparent 0 16%, hsl(var(--h) 90% 70% / .55) 17% 18.5%, transparent 19.5% 27%, hsl(var(--h) 90% 70% / .3) 28% 29%, transparent 30%); }
.m-stripes::before { background: repeating-linear-gradient(104deg, hsl(var(--h) 90% 62% / .2) 0 7px, transparent 7px 20px); }
.m-grid::before { background: radial-gradient(hsl(var(--h) 100% 68% / .55) 1.2px, transparent 1.8px) 0 0 / 9px 9px, linear-gradient(to top, hsl(var(--h2) 60% 6%) 0 25%, transparent 55%); }
.m-horizon::before { background: linear-gradient(to top, hsl(var(--h2) 60% 4%) 0 28%, transparent 29%), linear-gradient(to top, transparent 28%, hsl(var(--h) 90% 60% / .3) 29% 31%, transparent 32%); }
.p-title, .p-year { position: absolute; z-index: 1; left: 8%; right: 8%; color: #fff; }
.p-title { bottom: 8%; font: 700 .8rem/.95 var(--font-poster); font-size: 15cqw; text-transform: uppercase; letter-spacing: .02em; text-shadow: 0 2px 8px rgba(0, 0, 0, .6); overflow-wrap: anywhere; max-height: 56%; overflow: hidden; }
.p-year { top: 7%; font: 600 .6rem var(--font-poster); font-size: 8cqw; letter-spacing: .14em; opacity: .85; }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.poster.has-img::before, .poster.has-img::after { display: none; }
.poster.wide { aspect-ratio: auto; width: 100%; height: 100%; border-radius: 0; }
.poster.wide .p-title { font-size: 9cqw; right: 34%; bottom: 20%; }
.poster.wide .p-year { font-size: 3.2cqw; }
.mini { width: 52px; flex: none; border-radius: 8px; }
.mini .p-title, .mini .p-year { display: none; }
.badge { position: absolute; z-index: 2; top: 6px; right: 6px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: #fff; }
.badge .ic { width: 14px; height: 14px; stroke-width: 3; }
.badge.soft { background: rgba(0, 0, 0, .6); }
.badge.heart { top: auto; bottom: 6px; right: 6px; }

/* sections and rows */
.sec { display: grid; gap: 12px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-h h2 { font-size: 1.15rem; font-weight: 700; }
.link { min-height: 32px; padding: 0; border: 0; background: none; color: var(--muted); font-size: .85rem; }
.link:hover { color: var(--ink); }
.link.danger { color: var(--accent); }
.row-h { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; scroll-snap-type: x proximity; }
.row-h::-webkit-scrollbar { display: none; }
.tile { display: grid; gap: 6px; padding: 0; border: 0; background: none; text-align: left; align-content: start; min-width: 0; }
.row-h .tile { flex: 0 0 106px; scroll-snap-align: start; }
.tile-t { font-size: .84rem; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.tile-y { font-size: .76rem; color: var(--muted); margin-top: -4px; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 10px; }
.tile .poster-wrap { position: relative; }

/* featured carousel */
.feat-row { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; gap: 12px; border-radius: 16px; }
.feat-row::-webkit-scrollbar { display: none; }
.feat { position: relative; flex: 0 0 100%; aspect-ratio: 16 / 9; scroll-snap-align: center; border-radius: 16px; overflow: hidden; padding: 0; border: 0; background: var(--surface); text-align: left; }
.feat-meta { position: absolute; z-index: 2; left: 5%; bottom: 8%; font-size: .78rem; color: rgba(255, 255, 255, .85); }
.feat-go { position: absolute; z-index: 2; right: 5%; bottom: 8%; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: #fff; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: -10px; }
.dots i { width: 6px; height: 6px; border-radius: 99px; background: var(--line); transition: width .2s, background .2s; }
.dots i.on { width: 18px; background: var(--accent); }

/* chips */
.chips { min-width: 0; max-width: 100%; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font-size: .85rem; font-weight: 500; color: var(--muted); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* details */
.hero { position: relative; aspect-ratio: 3 / 4; max-height: 68svh; width: 100%; border-radius: 18px; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(to top, var(--bg) 0%, transparent 42%); pointer-events: none; }
.hero .poster { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; }
.hero .p-title, .hero .p-year { display: none; }
.hero-top { position: absolute; z-index: 3; inset: 12px 12px auto; display: flex; justify-content: space-between; gap: 8px; }
.hero-top .grp { display: flex; gap: 8px; }
.dhead { position: relative; z-index: 2; margin-top: -76px; display: grid; gap: 8px; }
.dhead h1 { font-size: 2rem; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: .88rem; }
.rate { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.rate .ic { color: var(--gold); fill: var(--gold); stroke: var(--gold); width: 20px; height: 20px; }
.rate small { color: var(--muted); font-weight: 400; }
.overview { color: var(--muted); max-width: 62ch; }
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.act { display: grid; justify-items: center; gap: 6px; padding: 12px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: .82rem; font-weight: 600; }
.act[data-f="want"][aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.act[data-f="watched"][aria-pressed="true"] { border-color: var(--ok); color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
.act[data-f="loved"][aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.person { display: flex; align-items: center; gap: 12px; }
.pic { --ph: 200; flex: none; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; background: hsl(var(--ph) 40% 34%); color: #fff; font-weight: 600; letter-spacing: .02em; }
.person small { display: block; color: var(--muted); font-size: .78rem; }
.person b { font-weight: 600; overflow-wrap: anywhere; }
.cast-row { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; }
.cast-row::-webkit-scrollbar { display: none; }
.cast { flex: 0 0 78px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.cast .pic { width: 64px; height: 64px; }
.cast b { font-size: .76rem; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.cast small { font-size: .72rem; color: var(--muted); line-height: 1.2; overflow-wrap: anywhere; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 16px; }

/* forms */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.f { display: grid; gap: 6px; }
.f > span { font-size: .8rem; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="search"], input[type="number"], select, textarea { width: 100%; min-height: 46px; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; }
textarea { resize: vertical; min-height: 84px; }
::placeholder { color: var(--muted); opacity: .8; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.btn { min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.alt { background: var(--surface2); color: var(--ink); border: 1px solid var(--line); }
.btn.full { width: 100%; }
.searchbox { position: relative; }
.searchbox .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.searchbox input { padding-left: 42px; }
.res { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px; border: 0; border-radius: 12px; background: var(--surface); text-align: left; }
.res + .res { margin-top: 8px; }
.res b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.res small { color: var(--muted); }
.res-body { min-width: 0; flex: 1; }
:root { --amber: #FFAE00; --amber-ink: #1A1200; --amber-text: #FFB81C; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --amber-text: #8F5400; } }
:root[data-theme="light"] { --amber-text: #8F5400; }
.auth { display: grid; gap: 14px; padding-block: 8px 24px; }
.abrand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.alogo { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: var(--accent); color: #fff; }
.alogo .ic { width: 22px; height: 22px; }
.abrand b { font-size: 1.15rem; letter-spacing: .04em; text-transform: uppercase; }
.abrand b span { color: var(--accent); }
.auth h1 { font-size: 2.4rem; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
.auth h2 { font-size: 2.2rem; font-weight: 700; line-height: 1.1; text-align: center; margin-top: 4px; }
.aform { display: grid; gap: 10px; }
.af { font-size: 1.1rem; font-weight: 500; margin-top: 8px; }
.req { color: #E0182D; font-style: normal; margin-left: 2px; }
.ainput { position: relative; }
.ainput input { width: 100%; min-height: 56px; padding: 0 14px; background: var(--surface); border: 3px solid var(--line); border-radius: 8px; font-size: 1rem; }
.ainput input:focus { border-color: var(--amber); outline: none; }
.ainput:has(.eye) input { padding-right: 56px; }
.eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; display: grid; place-items: center; border: 0; background: none; color: var(--muted); }
.abtn { min-height: 56px; margin-top: 10px; border: 0; border-radius: 8px; background: var(--amber); color: var(--amber-ink); font-size: 1.05rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }

.arow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; margin-top: 6px; }
.achk { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; font-size: 1.05rem; }
.achk input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 0; flex: none; border: 2px solid var(--muted); border-radius: 5px; background: transparent; display: grid; place-items: center; }
.achk input:checked { background: var(--amber); border-color: var(--amber); }
.achk input:checked::after { content: ""; width: 6px; height: 12px; border: solid var(--amber-ink); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.alink { min-height: 44px; padding: 0; border: 0; background: none; color: var(--amber-text); font-size: 1.05rem; }
.aor { display: flex; align-items: center; gap: 16px; margin-block: 14px 4px; font-weight: 700; }
.aor::before, .aor::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.aerr { padding: 12px 14px; border-left: 4px solid #E0182D; border-radius: 6px; background: var(--surface); font-size: .95rem; }
.aerr[hidden] { display: none; }
.aerr.info { border-left-color: var(--amber); display: grid; gap: 10px; }
.anote { color: var(--muted); font-size: .95rem; text-align: center; }
button.cast, button.person { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }

button.cast { text-align: center; }
.pic { overflow: hidden; }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gcode { font: 700 2rem/1.2 var(--font-poster); letter-spacing: .12em; text-align: center; color: var(--accent); margin: 8px 0; }
.tmh { font-size: 1.05rem; margin: 18px 0 8px; }

.pv { display: flex; align-items: center; gap: 12px; }
.pv .poster { width: 64px; flex: none; }

/* lists */
.list { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 12px 14px; border: 0; border-radius: 12px; background: var(--surface); text-align: left; font-weight: 500; }
.item .ic:first-child { color: var(--muted); }
.item span { flex: 1; min-width: 0; }
.item em { font-style: normal; color: var(--muted); font-size: .85rem; }
.item.danger { color: var(--accent); }
.item.danger .ic:first-child { color: var(--accent); }
.note { padding: 12px 14px; border-radius: 12px; background: var(--surface); color: var(--muted); font-size: .9rem; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; border: 1px solid var(--accent); border-radius: 12px; }

.sync { color: var(--muted); font-size: .76rem; text-align: center; }

/* profile */
.who { display: grid; justify-items: center; gap: 8px; text-align: center; }
.who .big { width: 96px; height: 96px; border-width: 3px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }

/* empty + welcome */
.empty { display: grid; justify-items: center; gap: 10px; padding: 36px 18px; text-align: center; border: 2px dashed var(--line); border-radius: 16px; color: var(--muted); }

.welcome { min-height: min(640px, 82svh); display: grid; align-content: center; justify-items: center; gap: 14px; text-align: center;
  background: radial-gradient(circle at 20% 15%, rgba(229, 37, 58, .35), transparent 45%), radial-gradient(circle at 85% 70%, rgba(80, 90, 255, .22), transparent 50%); border-radius: 22px; padding: 28px 20px; }
.logo { width: 76px; height: 76px; display: grid; place-items: center; border-radius: 20px; background: var(--accent); color: #fff; }

.welcome .btn { width: min(100%, 320px); margin-top: 8px; }

/* bottom nav + toast */
.nav { position: fixed; z-index: 20; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 480px); display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.nav button { display: grid; justify-items: center; gap: 3px; padding: 6px 0; border: 0; background: none; color: var(--muted); font-size: .72rem; font-weight: 500; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.toast { position: fixed; z-index: 30; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(92vw, 420px); padding: 10px 16px; border-radius: 99px; background: var(--ink); color: var(--bg); font-size: .88rem; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s; text-align: center; }

.pbar { position: absolute; z-index: 2; left: 6px; right: 6px; bottom: 6px; height: 4px; border-radius: 9px; background: rgba(255, 255, 255, .35); }
.pbar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.sp { gap: 12px; }
.sp-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }

.sp-sum { color: var(--muted); font-size: .82rem; }
.bar2 { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }

.sp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.sp-row span { flex: 1; min-width: 0; color: var(--muted); font-size: .85rem; }
.eps { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
.ep { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.ep[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.sp-tools { display: grid; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.inl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.inl label { font-size: .82rem; color: var(--muted); }
.inl input { width: 92px; flex: none; min-height: 40px; }
.smallbtn { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); font-size: .85rem; font-weight: 600; }
.smallbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fillmsg { font-size: .84rem; color: var(--muted); min-height: 1.2em; }
@media (prefers-reduced-motion: reduce) { .dots i, .toast { transition: none; } }

/* movie detail */
.rgn { font-size: .75rem; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.sec-h h2 { text-transform: uppercase; letter-spacing: .04em; font-size: .95rem; }
.wlist { display: grid; gap: 10px; }
.wrow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); min-width: 0; }

.vn { font-size: .8rem; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.about { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: start; }

/* home layout */
.jh { display: grid; gap: 12px; }
.jtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.wm.big { font-size: 1.7rem; display: inline-flex; align-items: center; gap: 9px; }
.hlogo { width: 38px; height: 38px; border-radius: 11px; display: block; box-shadow: 0 4px 14px rgba(0,0,0,.45); }
img.logo { width: 112px; height: 112px; border-radius: 28px; background: none; display: block; box-shadow: 0 16px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
img.alogo { width: 44px; height: 44px; border-radius: 12px; background: none; display: block; }
img.abt-logo { width: 112px; height: 112px; border-radius: 28px; background: none; border: 0; display: block; box-shadow: 0 14px 34px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.1); }
.jgrp { display: flex; align-items: center; gap: 8px; }
.jic { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; color: var(--ink); }
.avatar-btn.sm { width: 36px; height: 36px; }
.jtabs { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }

.jtabs .jsearch { display: flex; align-items: center; gap: 8px; flex: 1 0 120px; margin-left: 6px; padding: 0 12px; border-radius: 10px; background: var(--surface); color: var(--muted); }

.dd { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.sec-h .hh2, .hh2 { text-transform: none; font-size: 1.3rem; letter-spacing: -.015em; }
.gsub { color: var(--muted); font-size: .86rem; margin-top: 2px; }
.hh2 { font-size: 1.3rem; font-weight: 800; letter-spacing: -.015em; line-height: 1.15; text-wrap: balance; }
.dbadge { flex: none; width: 46px; height: 50px; display: grid; place-items: center; align-content: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.dbadge small { font-size: .58rem; font-weight: 800; letter-spacing: .08em; color: var(--accent); line-height: 1; }

.hsec { display: grid; gap: 12px; content-visibility: auto; contain-intrinsic-size: auto 280px; }
.hsec .sec-h { align-items: center; }
.snap { scroll-snap-type: x mandatory; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
.hrow2 { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; min-width: 0; max-width: 100%; }
.hrow2::-webkit-scrollbar { display: none; }

.tile:active, .crow:active, .spot:active, .t10r:active, .cr2:active { transform: scale(.97); }

.ptag { position: absolute; z-index: 2; bottom: 6px; padding: 2px 7px; border-radius: 6px; font-size: .64rem; font-weight: 800; letter-spacing: .03em; color: #fff; }

.ptag.nw { left: 6px; background: var(--accent); }
.ptag.th { left: 6px; background: #E8A317; color: #1a1200; }
.ptag.ot { left: 6px; background: #2D7DFF; color: #fff; }
.ccard { flex: 0 0 84%; scroll-snap-align: start; display: grid; gap: 4px; padding: 12px; border-radius: 16px; background: var(--surface); align-content: start; }
.chead b { display: inline-block; padding: 4px 12px; border-radius: 8px; background: var(--surface2); font-weight: 800; font-size: .9rem; }
.cr2, .t10r { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 0; border: 0; background: none; text-align: left; color: inherit; min-width: 0; }
.bign { flex: none; width: 34px; text-align: center; font-size: 2.3rem; font-weight: 800; line-height: 1; color: var(--muted); opacity: .35; letter-spacing: -.04em; }

.cb2 { flex: 1; min-width: 0; display: grid; gap: 2px; }

.spbg .p-title, .spbg .p-year { display: none; }

.spp, .spb, .sptag { position: relative; z-index: 2; }

@media (prefers-reduced-motion: reduce) { .snap { scroll-behavior: auto; } .hsec .poster img { animation: none; } .tile, .spot, .t10r, .cr2 { transition: none; } }

/* ===== Liquid Glass v2: capsule controls ===== */
:root {
  --g-fill: radial-gradient(130% 170% at 0% 0%, rgba(255,255,255,.34) 0%, rgba(255,255,255,.09) 40%, rgba(255,255,255,.03) 100%), linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
  --g-fill2: radial-gradient(130% 170% at 0% 0%, rgba(255,255,255,.46) 0%, rgba(255,255,255,.14) 42%, rgba(255,255,255,.06) 100%), linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
  --g-edge: rgba(255,255,255,.16);
  --g-hi: inset 0 1.5px 1px rgba(255,255,255,.8), inset 0 -1.5px 1px rgba(255,255,255,.2), inset 1.5px 0 1px rgba(255,255,255,.28), inset -1.5px 0 1px rgba(255,255,255,.12), inset 0 0 20px rgba(255,255,255,.07);
  --g-drop: 0 10px 28px rgba(0,0,0,.38), 0 2px 6px rgba(0,0,0,.25);
  --g-blur: blur(22px) saturate(2) brightness(1.08);
  --g-tint: rgba(255,255,255,.16);
  --o1: #ff2d55; --o2: #5e5ce6; --o3: #00c7be; --o4: #ff9f0a; --oa: .55;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --g-fill: radial-gradient(130% 170% at 0% 0%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.55) 45%, rgba(255,255,255,.38) 100%);
    --g-fill2: radial-gradient(130% 170% at 0% 0%, #fff 0%, rgba(255,255,255,.72) 50%, rgba(255,255,255,.55) 100%);
    --g-edge: rgba(255,255,255,.9);
    --g-hi: inset 0 1.5px 1px #fff, inset 0 -1.5px 1px rgba(255,255,255,.7), inset 0 0 0 1px rgba(40,40,90,.06);
    --g-drop: 0 10px 28px rgba(40,40,100,.16), 0 2px 6px rgba(40,40,100,.10);
    --g-tint: rgba(40,40,100,.08); --oa: .32;
  }
}
:root[data-theme="light"] {
  --g-fill: radial-gradient(130% 170% at 0% 0%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.55) 45%, rgba(255,255,255,.38) 100%);
  --g-fill2: radial-gradient(130% 170% at 0% 0%, #fff 0%, rgba(255,255,255,.72) 50%, rgba(255,255,255,.55) 100%);
  --g-edge: rgba(255,255,255,.9);
  --g-hi: inset 0 1.5px 1px #fff, inset 0 -1.5px 1px rgba(255,255,255,.7), inset 0 0 0 1px rgba(40,40,90,.06);
  --g-drop: 0 10px 28px rgba(40,40,100,.16), 0 2px 6px rgba(40,40,100,.10);
  --g-tint: rgba(40,40,100,.08); --oa: .32;
}
/* living colour behind the glass */
body::before, body::after { content: ""; position: fixed; z-index: -1; pointer-events: none; width: 120vmax; height: 120vmax; border-radius: 50%; will-change: transform; opacity: var(--oa); }
body::before { left: -60vmax; top: -50vmax; background: radial-gradient(closest-side, var(--o1), transparent 70%), radial-gradient(closest-side at 80% 70%, var(--o2), transparent 65%); animation: orbA 26s ease-in-out infinite alternate; }

/* ===== Glass v6: alive, landing-page vibe ===== */
:root{--live1:#6C8BFF;--live2:#C74BFF;--live3:#19E3C8;--live4:#FFB84D}
/* header: only the top row is a glass pill, tabs sit free below (fixes broken header) */

/* bottom nav: clear, vivid active pill */
.nav button{color:var(--ink)!important;opacity:.62;transition:opacity .3s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.nav button[aria-current="page"]{opacity:1;color:#fff!important;font-weight:700}
.nav::before{background:linear-gradient(135deg,var(--live1),var(--live2))!important;border:1px solid rgba(255,255,255,.55)!important;box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.6),0 8px 22px rgba(120,90,255,.55)!important}
.nav button[aria-current="page"] svg{animation:navPop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes navPop{0%{transform:scale(.6) translateY(4px)}100%{transform:scale(1.1)}}
:root[data-theme="light"] .nav button[aria-current="page"]{color:#fff!important}
/* living background */
body::before{animation-duration:16s!important}
body::after{animation-duration:21s!important}
@keyframes orbA{from{transform:translate3d(0,0,0) rotate(0) scale(1)}to{transform:translate3d(22vmax,16vmax,0) rotate(60deg) scale(1.2)}}
@keyframes orbB{from{transform:translate3d(0,0,0) rotate(0) scale(1)}to{transform:translate3d(-20vmax,-14vmax,0) rotate(-55deg) scale(1.25)}}
/* hero title shimmer */
.hh{background:linear-gradient(100deg,var(--ink) 0%,var(--live1) 30%,var(--live2) 52%,var(--live3) 72%,var(--ink) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shimmer 7s ease-in-out infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.gsub{animation:rvIn .8s .2s both}
/* posters: gentle float, sheen, tap lift */
.tile{animation:rvIn .7s cubic-bezier(.2,.8,.2,1) both}
.tile:nth-child(2){animation-delay:.07s}.tile:nth-child(3){animation-delay:.14s}.tile:nth-child(4){animation-delay:.21s}.tile:nth-child(n+5){animation-delay:.28s}
.tile .poster-wrap{border-radius:16px;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.38),0 0 0 1px rgba(255,255,255,.14);transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.tile .poster-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 6s ease-in-out infinite;pointer-events:none}
.tile:nth-child(2n) .poster-wrap::after{animation-delay:1.5s}.tile:nth-child(3n) .poster-wrap::after{animation-delay:3s}
@keyframes sheen{0%,60%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.tile:active .poster-wrap{transform:scale(.94) rotate(-.6deg);box-shadow:0 6px 14px rgba(0,0,0,.4)}
/* section titles & badges */
.sec-h h2{background:linear-gradient(90deg,var(--ink),var(--ink));-webkit-background-clip:text;background-clip:text}

      '<h2 class="mlabel">Backup</h2><details class="mbo mcard flush"><summary class="mrow"><span class="mi">' + ic('cloud') + '</span><span class="mt"><b>More backup options</b><small>Back up or restore with words</small></span>' + ic('chev') + '</summary><div class="mbo-body">' + lbCard() + '</div></details>' +

  /* ---------- render ---------- */
  function navActive(v) {
    if (v.v === 'home') return 'home';
    if (v.v === 'grid' && (v.k === 'new' || v.k === 'want' || v.k === 'watched')) return v.k;

  }
  var LASTSIG = '';
  function render() {
    var v = cur(), h;
    try { document.documentElement.classList.toggle('on-details', v.v === 'details'); document.documentElement.classList.toggle('on-profile', v.v === 'profile'); } catch (e) {}

    if (STANDALONE && !ui.unlocked) { screen.innerHTML = vLock(); nav.hidden = true; qTranslate(); return; }
    if (!settled && !welcomed) h = '<section class="welcome">' + logoImg('logo') + '<h1>Movie <span>Vault</span></h1></section>';
    else if (!welcomed) h = vWelcome();
    else if (v.v === 'home') h = vHome();
    else if (v.v === 'grid') h = vGrid(v);
    else if (v.v === 'details') h = vDetails(v);
    else if (v.v === 'search') h = vSearch(v);
    else if (v.v === 'add') h = vAdd(v);

    else if (v.v === 'person') h = vPerson(v);

    else if (v.v === 'online') { h = vOnline(); if (!ON.items.length && !ON.busy && ON.msg !== 'nokey') setTimeout(function () { onLoad(false); }, 0); else if (!tmKey()) ON.msg = 'nokey'; }
    else h = vProfile();
    var sig = v.v + '|' + (v.k || '') + '|' + (v.key || '') + '|' + (v.id || '');
    var hs0 = [];
    if (sig === LASTSIG) { try { hs0 = Array.prototype.map.call(screen.querySelectorAll('.row-h,.hrow2,.chips,.jtabs'), function (el) { return el.scrollLeft; }); } catch (e) {} }
    screen.innerHTML = h;
    if (hs0.length) { try { Array.prototype.forEach.call(screen.querySelectorAll('.row-h,.hrow2,.chips,.jtabs'), function (el, i) { if (hs0[i]) el.scrollLeft = hs0[i]; }); } catch (e) {} }
    if (sig !== LASTSIG) { LASTSIG = sig; screen.classList.remove('enter'); void screen.offsetWidth; screen.classList.add('enter'); }
    if (v.v === 'details') { provLoad(v.key); enrich(v.key); seasonSync(v.key); picsFill(); }
    if (v.v === 'about') ghLoad(false);
    if (v.v === 'update' && !UPD.busy && (!UPD.res || Date.now() - UPD.ts > 3600000)) setTimeout(updCheck, 0);
    if (v.v === 'person') { if (!PP[v.id] && !v.err && !v.loading) { v.loading = true; personLoad(v); } }
    var a = welcomed ? navActive(v) : '';
    nav.hidden = !a;
    qTranslate();
    var defs = { home: ['home', 'Home'], new: ['grid', 'New Releases'], want: ['bookmark', 'Watchlist'], watched: ['checkc', 'Watched'] };
    nav.style.setProperty('--i', Math.max(0, ['home', 'new', 'want', 'watched'].indexOf(a)));
    nav.style.gridTemplateColumns = ['home', 'new', 'want', 'watched'].map(function (k) { return k === a ? '1.45fr' : '1fr'; }).join(' ');
    nav.querySelectorAll('button').forEach(function (b) {
      var t = b.dataset.t;
      b.innerHTML = ic(defs[t][0]) + '<span>' + defs[t][1] + '</span>';
      if (t === a) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }
  function softRender() {
    var v = cur();
    if (STANDALONE && !ui.unlocked) return;
    if (v.v === 'add') return;
    if (v.v === 'search') { var r = $('results'); if (r) r.innerHTML = resultsHtml(v.q || ''); return; }
    render();
  }
  /* Android back button: every in-app page pushes one history entry, so the system Back pops the page instead of closing the app */
  var HD = 0, HIGN = 0;
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
  var APPP = null;
  try { if (window.Capacitor && Capacitor.isPluginAvailable && Capacitor.isPluginAvailable('App')) APPP = (Capacitor.Plugins && Capacitor.Plugins.App) || (Capacitor.registerPlugin ? Capacitor.registerPlugin('App') : null); } catch (e) { APPP = null; }
  function hpush() { if (APPP) return; try { history.pushState({ rv: HD + 1 }, ''); HD++; } catch (e) {} }
  function hreset() { if (!APPP && HD > 0) { var n = HD; HD = 0; try { HIGN++; history.go(-n); } catch (e) { HIGN = 0; } } }
  function go(v) { ui.stack.push(v); hpush(); ui.confirm = ''; window.scrollTo(0, 0); render(); if (v.v === 'search') { var q = $('q'); if (q) q.focus(); } }
  function back() {
    if (HD > 0) { try { history.back(); return; } catch (e) {} }
    if (ui.stack.length > 1) ui.stack.pop(); ui.confirm = ''; window.scrollTo(0, 0); render();
  }
  window.addEventListener('popstate', function () {
    if (HIGN > 0) { HIGN--; return; }
    if (HD > 0) HD--;
    if (ui.stack.length > 1) ui.stack.pop();
    ui.confirm = ''; window.scrollTo(0, 0); render();
  });
  var LASTBACK = 0;
  if (APPP && APPP.addListener) {
    try {
      APPP.addListener('backButton', function () {
        if (ui.confirm) { ui.confirm = ''; render(); return; }
        if (ui.stack.length > 1) { back(); return; }
        var now = Date.now();
        if (now - LASTBACK < 2000) { try { APPP.exitApp(); } catch (e) {} } else { LASTBACK = now; toast('Press back again to exit'); }
      });
    } catch (e) {}
  }
  gdInit();
  function tab(t) {
    ui.stack = [t === 'home' ? { v: 'home' } : { v: 'grid', k: t }];
    hreset();
    ui.confirm = '';
    window.scrollTo(0, 0);
    render();
  }

  /* ---------- posters ---------- */
  function readPoster(file) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onerror = rej;
      fr.onload = function () {
        var img = new Image();
        img.onerror = rej;
        img.onload = function () {
          var W = 360, H = 540, s = Math.max(W / img.width, H / img.height);
          var c = document.createElement('canvas');
          c.width = W; c.height = H;
          var w = img.width * s, h = img.height * s;
          c.getContext('2d').drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
          res(c.toDataURL('image/jpeg', 0.82));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  fileEl.addEventListener('change', function () {
    var f = fileEl.files && fileEl.files[0], target = ui.posterTarget;
    fileEl.value = '';
    if (!f || !target) return;
    readPoster(f).then(function (url) {
      if (target === '__draft') {
        ui.draft.poster = url;
        var pv = $('pv');
        if (pv) pv.innerHTML = '<div class="poster has-img"><img src="' + url + '" alt=""></div><button type="button" class="btn alt" data-act="poster" data-key="__draft">' + ic('camera') + ' Change poster</button>';
      } else {
        var d = docs.get(target);
        d = d ? Object.assign({}, d) : { kind: 'c', want: false, watched: false, loved: false, ts: 0 };
        d.poster = url;
        docs.set(target, d);
        persist(target);
        render();
        toast('Poster updated.');
      }
    }).catch(function () { toast('Could not read that image.'); });
  });

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act, key = b.dataset.key;
    if (act === 'tab') tab(b.dataset.t);
    else if (act === 'open') go({ v: 'details', key: key });
    else if (act === 'back') back();
    else if (act === 'search') go({ v: 'search', q: '' });
    else if (act === 'settings') go({ v: 'settings' });
    else if (act === 'profile') go({ v: 'profile' });
    else if (act === 'grid') go({ v: 'grid', k: b.dataset.k, ind: b.dataset.ind, g: b.dataset.g });
    else if (act === 'add') { ui.draft = { poster: null }; go({ v: 'add', t: b.dataset.t || '' }); if (b.dataset.auto === '1') setTimeout(autofill, 0); }
    else if (act === 'sel-season') { ui.sel[key] = Number(b.dataset.s); render(); }
    else if (act === 'ep') toggleEp(key, Number(b.dataset.s), Number(b.dataset.e));
    else if (act === 'season-all') toggleSeason(key, Number(b.dataset.s));
    else if (act === 'autofill') autofill();
    else if (act === 'sync-now') { if (false) toast(''); else { toast('Checking...'); autoSync(true); } }
    else if (act === 'syn-toggle') { var sw = b.closest('.synw'); if (sw) { var on2 = sw.classList.toggle('open'); b.setAttribute('aria-expanded', on2 ? 'true' : 'false'); } }
    else if (act === 'share') {
      var sit = getItem(b.dataset.key), stxt = sit ? sit.title + (sit.year ? ' (' + sit.year + ')' : '') + ' — found on Movie Vault' : 'Movie Vault';
      try { if (navigator.share) { navigator.share({ title: sit ? sit.title : 'Movie Vault', text: stxt }).catch(function () {}); }
        else if (navigator.clipboard) { navigator.clipboard.writeText(stxt).then(function () { toast('Copied to clipboard.'); }, function () { toast(stxt); }); }
        else toast(stxt); } catch (e6) { toast(stxt); }
    }
    else if (act === 'ww-toggle') { ui.ww = !ui.ww; b.setAttribute('aria-pressed', ui.ww ? 'true' : 'false'); var wsx = $('pv-watch'); if (wsx) wsx.classList.toggle('open', ui.ww); }
    else if (act === 'open-url') { try { window.open(b.dataset.u, '_blank'); } catch (e5) {} }
    else if (act === 'logout') signOut();
    else if (act === 'lost') {
      var lu = $('lUser'); ui.lu = lu ? lu.value : '';
      if (!acct()) {
        var le = String(ui.lu || '').trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(le)) showErr('lerr', 'Type your email address above first.');
        else fbPost('accounts:sendOobCode', { requestType: 'PASSWORD_RESET', email: le }).then(function () { showErr('lerr', 'If this email has an account, a reset link was sent. Check your inbox.'); }, function (e8) { showErr('lerr', fbErr(e8.message)); });
      } else { ui.confirm = 'forgot'; render(); }
    }
    else if (act === 'eye') {
      var inp = b.parentNode.querySelector('input'), show = inp.type === 'password';
      inp.type = show ? 'text' : 'password'; b.setAttribute('aria-pressed', String(show));
      b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); b.innerHTML = ic(show ? 'eyeoff' : 'eye'); inp.focus();
    }
    else if (act === 'forgot-yes') { ui.confirm = ''; ui.lu = ''; ['reelvault.v1', 'reelvault.synced', 'reelvault.welcomed', 'reelvault.cloud', LS_ACCT, LS_REM].forEach(function (k) { lsDel(k); }); CL.tok = ''; ssDel(SS_SESS); docs = new Map(); render(); }
    else if (act === 'cl-del-ask') { ui.confirm = 'cldel'; render(); }
    else if (act === 'cl-del-yes') clDelete();
    else if (act === 'gd-connect') gdConnect();
    else if (act === 'gd-backup') gdBackup();
    else if (act === 'lb-copy') { wPack(snapshot()).then(function (w) { return copyText(w.join(' ')); }).then(function (ok) { toast(ok ? 'Backup words copied. Paste them somewhere safe.' : 'Could not copy. Try again.'); }); }
    else if (act === 'lb-restore') {
      var ta = $('lbText'), lm = $('lbmsg'), tx = (ta && ta.value || '').trim();
      var pr = tx.charAt(0) === '{' ? Promise.resolve(tx) : Promise.resolve().then(function () { return wUnpack(tx); });
      pr.then(function (js) { var cnt = applyBackup(JSON.parse(js)); toast('Restored ' + cnt + ' items.'); render(); })
        .catch(function () { var m2 = $('lbmsg'); if (m2) m2.textContent = 'These words are not a valid backup. Check you pasted all of them.'; });
    }
    else if (act === 'gd-restore-ask') { ui.confirm = 'restore'; render(); }
    else if (act === 'gd-restore-yes') gdRestore();
    else if (act === 'gd-off') { var g3 = gdGet(); delete g3.email; delete g3.refresh; gdSet(g3); GD.msg = 'Disconnected.'; render(); }
    else if (act === 'tm-add') tmImport(b.dataset.id, b.dataset.mt);
    else if (act === 'toggle') toggle(key, b.dataset.f);
    else if (act === 'online') { ON.msg = ''; go({ v: 'online' }); }
    else if (act === 'on-feed') { ON.feed = b.dataset.f; render(); onLoad(false); }
    else if (act === 'on-more') onLoad(true);
    else if (act === 'more') { var cv0 = cur(); cv0.lim = (cv0.lim || (cv0.v === 'person' ? 60 : 90)) + 60; if (cv0.v === 'person') personDraw(); else render(); }
    else if (act === 'person') go({ v: 'person', name: b.dataset.name, id: Number(b.dataset.id) || 0, pf: 'all' });
    else if (act === 'pchip') { cur().pf = b.dataset.c; cur().lim = 60; personDraw(); }
    else if (act === 'tm-open') tmImport(b.dataset.id, b.dataset.mt, true);
    else if (act === 'chip') { cur().chip = b.dataset.c; render(); }
    else if (act === 'start') { lsSet(LS_WELCOME, '1'); setProfile({ welcomed: true, theme: themePref() }); render(); }
    else if (act === 'poster') { ui.posterTarget = key; fileEl.click(); }
    else if (act === 'poster-clear') {
      var d = docs.get(key);

    else if (act === 'about') go({ v: 'about' });

    else if (act === 'upd-check') updCheck();
    else if (act === 'reset-ask') { ui.confirm = 'reset'; render(); }
    else if (act === 'confirm-no') { ui.confirm = ''; render(); }
    else if (act === 'reset-yes') {
      Array.from(docs.keys()).forEach(function (id) { if (/^(c_|u_)/.test(id)) removeDoc(id); });
      ui.confirm = '';
      render();
      toast('Your lists were cleared.');
    }
    else if (act === 'del-ask') { ui.confirm = 'del:' + key; render(); }
    else if (act === 'del-yes') { removeDoc(key); ui.confirm = ''; back(); toast('Title deleted.'); }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { var v = cur(); v.q = e.target.value; var r = $('results'); if (r) r.innerHTML = resultsHtml(v.q); tmSearch(v.q); }
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'addForm') return;
    e.preventDefault();
    var title = $('aTitle').value.trim().replace(/\s+/g, ' ');
    if (!title) { toast('Type a title first.'); $('aTitle').focus(); return; }
    var year = parseInt($('aYear').value, 10) || 0;
    var type = $('aType').value;
    var dup = allItems().some(function (i) { return i.title.toLowerCase() === title.toLowerCase() && (!year || !i.year || i.year === year); });
    if (dup) { toast('That title is already in Movie Vault.'); return; }
    var imdb = parseFloat($('aImdb').value);
    var split = function (s) { return s.split(',').map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 12); };
    var list = $('aList').value;
    var key = 'u_' + newId();
    var d = { kind: 'u', title: title, type: type, year: year || 0, industry: $('aInd').value, seasons: type === 'series' ? parseSeasons($('aSeasons').value) : [], genres: split($('aGenres').value), director: $('aDir').value.trim(),

      overview: $('aOverview').value.trim(), want: list === 'want', watched: list === 'watched', loved: false, ts: Date.now() };
    var p = safeImg(ui.draft.poster);
    if (p) d.poster = p;
    docs.set(key, d);
    persist(key);
    ui.draft = { poster: null };
    ui.stack[ui.stack.length - 1] = { v: 'details', key: key };
    ui.confirm = ''; window.scrollTo(0, 0); render();
    toast('Saved “' + title + '”.');
  });

  document.addEventListener('scroll', function (e) {
    var t = e.target;
    if (!t || t.id !== 'featRow') return;
    var dots = $('dots');
    if (!dots) return;
    var i = Math.round(t.scrollLeft / (t.clientWidth + 12));

  document.addEventListener('visibilitychange', function () { if (!document.hidden && (!STANDALONE || ui.unlocked)) autoSync(false); });
  setInterval(function () { if (!document.hidden && (!STANDALONE || ui.unlocked)) autoSync(false); }, 30 * 60 * 1000);
